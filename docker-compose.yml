services:

  postgres-commerce:
    image: postgres:15
    container_name: postgres-commerce
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: commerce_db
    ports:
      - "5432:5432"

  commerce-hub-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commerce-hub-app
    depends_on:
      - postgres-commerce
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=postgresql
    restart: unless-stopped
